<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文闖關學習系統 - 手機優化版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

      font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 隱藏橫向滾動條 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header 導覽列 (手機優化) -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg shadow-indigo-200 shadow-md">
          あ
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-800 leading-none">日文闖關學習</h1>
          <p class="text-[10px] text-slate-400 mt-0.5">隨機測驗 & 動態錯題本</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- 開發者模式按鈕 -->
        <button id="developerButton" onclick="toggleDevModeModal()" title="開發者模式" aria-label="開啟開發者模式" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-code"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區域 -->
  <main class="max-w-5xl mx-auto px-3 py-3 flex-1 w-full space-y-3 pb-20">

    <!-- 階段選擇 (手機橫向滑動卡片) -->
    <nav class="overflow-x-auto no-scrollbar py-1">
      <div class="flex gap-2 min-w-max px-1" id="phaseTabContainer">
        <!-- JavaScript 動態渲染階段頁籤 -->
      </div>
    </nav>

    <!-- 頂部資訊卡片 (狀態、計時與手動更新) -->
    <div id="statusHeader" class="bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-2xl p-4 text-white shadow-md shadow-indigo-100 space-y-2">
      <div class="flex items-center justify-between">
        <span id="phaseBadge" class="px-2.5 py-0.5 bg-white/20 backdrop-blur-md text-white text-[11px] font-bold rounded-lg border border-white/20">
          階段 1
        </span>
        <div id="networkControl" class="hidden flex items-center gap-2 text-xs">
          <span class="text-indigo-200 text-[10px]">內容更新:</span>
          <span id="countdownTimer" class="font-mono font-bold text-amber-300">30:00</span>
          <button onclick="triggerNetworkUpdate()" class="ml-1 w-6 h-6 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition">
            <i class="fa-solid fa-arrows-rotate text-[10px]" id="refreshSpinner"></i>
          </button>
        </div>
      </div>
      <h2 id="phaseTitle" class="text-base font-bold leading-tight">清音 50 音基礎練習區</h2>
    </div>

    <!-- 開發者模式選單 (Modal 形式) -->
    <div id="devModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 hidden">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-sliders text-amber-500"></i> 開發者測試控制台
          </h3>
          <button onclick="toggleDevModeModal()" class="text-slate-400 text-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="grid grid-cols-1 gap-2 text-xs">
          <p class="p-3 bg-emerald-50 text-emerald-800 rounded-xl font-bold">開發者模式已開啟：所有階段與測驗均可使用。</p>
          <button onclick="disableDeveloperMode()" class="p-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-left">關閉開發者模式</button>
          <button onclick="triggerNetworkUpdate(); toggleDevModeModal();" class="p-3 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-xl font-medium text-left flex items-center justify-between">
            <span>⚡ 強制刷新網路 API 題庫</span>
            <i class="fa-solid fa-bolt text-amber-500"></i>
          </button>
          <button onclick="timerSeconds=5; updateTimerDisplay(); toggleDevModeModal();" class="p-3 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-xl font-medium text-left flex items-center justify-between">
            <span>⏱️ 將倒數計時縮短至 5 秒</span>
            <i class="fa-solid fa-clock text-amber-500"></i>
          </button>
          <button onclick="clearWrongQuestions(); toggleDevModeModal();" class="p-3 bg-red-50 hover:bg-red-100 text-red-800 rounded-xl font-medium text-left flex items-center justify-between">
            <span>🗑️ 清空所有錯題記錄</span>
            <i class="fa-solid fa-trash text-red-500"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 主練習內容呈現區 -->
    <section id="contentArea" class="space-y-3">
      <!-- 動態載入內容 -->
    </section>

  </main>

  <!-- 全螢幕測驗 Modal (手機端滿版設計) -->
  <div id="testModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-end sm:items-center justify-center z-50 hidden">
    <div class="bg-white w-full max-w-md h-[92vh] sm:h-auto sm:max-h-[85vh] rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col">
      <!-- Modal Header -->

        </div>

      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {

        [result[i], result[j]] = [result[j], result[i]];

      { title: '禮貌詢問', formula: '疑問詞 + ですか', example: 'トイレはどこですか。(洗手間在哪裡？)' },
      { title: '表達想要', formula: '名詞 + が欲しいです', example: '水が欲しいです。(我想要水。)' },
      { title: '表達想做', formula: '動詞ます形去掉ます + たいです', example: '日本に行きたいです。(我想去日本。)' },
      { title: '詢問許可', formula: '動詞て形 + もいいですか', example: 'ここに座ってもいいですか。(可以坐這裡嗎？)' },
      { title: '表達正在做', formula: '動詞て形 + います', example: '今、昼ご飯を食べています。(我現在正在吃午餐。)' },
      { title: '描述習慣', formula: '時間 + 動詞ます形', example: '毎朝コーヒーを飲みます。(我每天早上喝咖啡。)' },
      { title: '表達原因', formula: '原因 + から、結果', example: '雨が降っているから、家にいます。(因為在下雨，所以待在家。)' },
      { title: '表達經驗', formula: '動詞た形 + ことがあります', example: '日本へ行ったことがあります。(我去過日本。)' },
      { title: '表達否定', formula: 'い形容詞去掉い + くないです', example: '今日は寒くないです。(今天不冷。)' },
      { title: '表達比較', formula: 'A より B のほうが + 形容詞', example: '電車よりバスのほうが安いです。(公車比電車便宜。)' },
      { title: '邀請對方', formula: '動詞ます形去掉ます + ませんか', example: '一緒に昼ご飯を食べませんか。(要不要一起吃午餐？)' }
    ];

    let dynamicPhase4Data = backupPhase4.slice(0, 5);
    let dynamicPhase5Data = backupPhase5.slice(0, 4);
    const hasLoadedOnlineContent = { 4: false, 5: false };
    const contentUpdateStatus = { 4: '目前顯示內建例句，按更新取得網路句子。', 5: '目前顯示內建例句，按更新取得網路句子。' };
    let contentRequestId = 0;
    const dailyQueries = ['ありがとう', 'お願い', '駅', '電車', 'バス', '食べ', '飲み', '買い', '時間', '仕事', '学校', '友達', '天気', '今日', '明日'];
    const grammarQueries = [
      { title: '請求與拜託', formula: '動詞て形 + ください', query: 'ください' },
      { title: '詢問許可', formula: '動詞て形 + もいいですか', query: 'てもいいですか' },
      { title: '表達想做', formula: '動詞ます形去掉ます + たいです', query: 'たいです' },
      { title: '表達正在做', formula: '動詞て形 + います', query: 'ています' },
      { title: '禮貌詢問', formula: '疑問詞 + ですか', query: 'どこですか' },
      { title: '表達經驗', formula: '動詞た形 + ことがあります', query: 'ことがあります' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      switchPhase(1);
      startCountdownTimer();
      startStudyTimer();
      window.addEventListener('resize', () => {
        if (currentPhase <= 3 && selectedExamples[currentPhase] !== null) {
          placeExampleAfterRow(selectedExamples[currentPhase]);
        }
      });
    });

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
        return { seconds: saved.seconds || {}, passed: saved.passed || {} };
      } catch (_) {
        return { seconds: {}, passed: {} };
      }
    }

    function saveProgress() {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (_) { /* Private browsing may block storage. */ }
    }

    function phaseUnlocked(phase) {
      return developerMode || phase === 1 || phase === 99 || (phase >= 2 && phase <= 5 && !!progress.passed[phase - 1]);
    }

    function studySeconds(phase) {
      return Math.min(PHASE_STUDY_HOURS[phase] * 3600, Number(progress.seconds[phase]) || 0);
    }

    function renderStudyStatus() {
      const status = document.getElementById('studyStatus');
      if (status && currentPhase !== 99) {
        const required = PHASE_STUDY_HOURS[currentPhase] * 3600;
        const studied = studySeconds(currentPhase);
        const remaining = Math.max(0, required - studied);
        const remainingMinutes = Math.ceil(remaining / 60);
        const studiedHours = Math.floor(studied / 3600);
        const studiedMinutes = Math.floor((studied % 3600) / 60);
        status.textContent = `已學習 ${studiedHours} 小時 ${studiedMinutes} 分鐘／目標 ${PHASE_STUDY_HOURS[currentPhase]} 小時 · ` +
          (developerMode ? '開發者模式：可立即考試' : progress.passed[currentPhase] ? '已通過測驗' : remaining ? `還需 ${Math.floor(remainingMinutes / 60)} 小時 ${remainingMinutes % 60} 分鐘才能考試` : '可參加測驗 · 通過分數 85 分');
      }
      const button = document.getElementById('phaseTestButton');
      if (button) {
        button.disabled = !developerMode && studySeconds(currentPhase) < PHASE_STUDY_HOURS[currentPhase] * 3600;
        button.classList.toggle('opacity-50', button.disabled);
      }
    }

    function startStudyTimer() {
      let lastTick = Date.now();
      let lastSaved = Date.now();
      setInterval(() => {
        const now = Date.now();
        const elapsed = Math.min(2, Math.max(0, (now - lastTick) / 1000));
        lastTick = now;
        if (document.hidden || currentPhase === 99 || !phaseUnlocked(currentPhase) || studySeconds(currentPhase) >= PHASE_STUDY_HOURS[currentPhase] * 3600 || !document.getElementById('testModal').classList.contains('hidden') || !document.getElementById('devModal').classList.contains('hidden')) return;
        progress.seconds[currentPhase] = studySeconds(currentPhase) + elapsed;
        if (now - lastSaved >= 15000) { saveProgress(); lastSaved = now; }
        renderStudyStatus();
      }, 1000);
      window.addEventListener('pagehide', saveProgress);
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });
    }

    function toggleDevModeModal() {
      const modal = document.getElementById('devModal');
      if (modal.classList.contains('hidden')) {
        developerMode = true;
        document.getElementById('developerButton').classList.add('bg-emerald-100', 'text-emerald-700');
        renderTabs();
        renderStudyStatus();
      }
      modal.classList.toggle('hidden');
    }

    function disableDeveloperMode() {
      developerMode = false;
      document.getElementById('developerButton').classList.remove('bg-emerald-100', 'text-emerald-700');
      document.getElementById('devModal').classList.add('hidden');
      if (!phaseUnlocked(currentPhase)) switchPhase(1);
      else { renderTabs(); renderStudyStatus(); }
    }

    function renderTabs() {
      const tabs = [
        { id: 1, name: '階段 1', desc: '五十音 · 30h' },
        { id: 2, name: '階段 2', desc: '單字句型 · 150h' },
        { id: 3, name: '階段 3', desc: '中級文法 · 300h' },
        { id: 4, name: '階段 4', desc: '實戰表達 · 400h' },
        { id: 5, name: '階段 5', desc: '綜合沉浸 · 200h' },
        { id: 99, name: '錯題本', desc: '弱點' }
      ];

      const container = document.getElementById('phaseTabContainer');
      container.innerHTML = tabs.map(tab => `
        <button onclick="switchPhase(${tab.id})" ${phaseUnlocked(tab.id) ? '' : 'disabled title="請先通過前一階段測驗"'} class="px-3 py-2 rounded-xl flex flex-col items-center justify-center transition ${!phaseUnlocked(tab.id) ? 'opacity-45 cursor-not-allowed bg-slate-100 text-slate-400 border border-slate-200' : tab.id === currentPhase ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100 font-bold' : 'bg-white text-slate-600 border border-slate-200'}">
          <span class="text-xs font-bold leading-none">${tab.name}</span>
          <span class="text-[9px] opacity-75 mt-1">${tab.desc}</span>
        </button>
      `).join('');
    }

    function switchPhase(phaseId) {
      if (!phaseUnlocked(phaseId)) return;
      currentPhase = phaseId;
      document.getElementById('refreshSpinner').classList.remove('fa-spin');
      renderTabs();

      const phaseTitles = {
        1: '階段 1：五十音與基礎發音 · 30 小時',
        2: '階段 2：基礎單字與句型 N5～N4 · 150 小時',
        3: '階段 3：中級文法與詞彙 N3～N2 · 300 小時',
        4: '階段 4：實戰應用與表達 · 400 小時',
        5: '階段 5：綜合測驗與生活沉浸 · 200 小時',
        99: '錯題本：個人弱點強化複習'
      };

      document.getElementById('phaseBadge').innerText = phaseId === 99 ? '弱點' : `階段 ${phaseId}`;
      document.getElementById('phaseTitle').innerText = phaseTitles[phaseId];

      const netControl = document.getElementById('networkControl');
      if (phaseId <= 5) {
        netControl.classList.remove('hidden');
      } else {
        netControl.classList.add('hidden');
      }

      renderContent();
      renderStudyStatus();
      if (phaseId <= 3 && !onlineHints[phaseId]) updateLearningHint(phaseId);
      if ((phaseId === 4 || phaseId === 5) && !hasLoadedOnlineContent[phaseId]) triggerNetworkUpdate();
    }

    function startCountdownTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds--;
        if (timerSeconds <= 0) {
          timerSeconds = 1800;
          if (!document.hidden && currentPhase <= 5) triggerNetworkUpdate();
        }
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      const timerEl = document.getElementById('countdownTimer');
      if (timerEl) timerEl.innerText = `${m}:${s}`;
    }

    async function searchDailySentences(query, page = Math.floor(Math.random() * 3) + 1) {
      const url = `https://tatoeba.org/en/api_v0/search?from=jpn&to=cmn&query=${encodeURIComponent(query)}&page=${page}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('network');
      const payload = await response.json();
      return (payload.results || []).flatMap(item => {
        const translations = (item.translations || []).flat();
        const translation = translations.find(entry => entry?.lang === 'cmn' && entry.text);
        const jp = item.text?.trim();
        const tw = translation?.text?.trim();
        return jp && tw && jp.length <= 70 && tw.length <= 100 ? [{ jp, tw }] : [];
      });
    }

    async function triggerNetworkUpdate() {
      timerSeconds = 1800;
      updateTimerDisplay();
      if (currentPhase <= 3) return updateLearningHint(currentPhase);
      if (currentPhase !== 4 && currentPhase !== 5) return;
      const phase = currentPhase;
      const requestId = ++contentRequestId;
      const spinner = document.getElementById('refreshSpinner');
      if (spinner) spinner.classList.add('fa-spin');
      contentUpdateStatus[phase] = '正在取得網路例句…';
      renderContent();
      renderStudyStatus();
      try {
        if (phase === 4) {
          const queries = shuffle(dailyQueries).slice(0, 3);
          const results = await Promise.allSettled(queries.map(searchDailySentences));
          const current = new Set(dynamicPhase4Data.map(item => item.jp));
          const unique = new Set();
          const sentences = results.flatMap(result => result.status === 'fulfilled' ? result.value : [])
            .filter(item => !current.has(item.jp) && !unique.has(item.jp) && unique.add(item.jp));
          if (sentences.length < 3) throw new Error('not enough sentences');
          if (requestId !== contentRequestId) return;
          dynamicPhase4Data = shuffle(sentences).slice(0, 5).map(item => ({ ...item, scenario: '網路日常例句' }));
        } else {
          const queries = shuffle(grammarQueries).slice(0, 4);
          const results = await Promise.allSettled(queries.map(item => searchDailySentences(item.query, 1)));
          const current = new Set(dynamicPhase5Data.map(item => item.example));
          const online = queries.flatMap((item, index) => {
            const result = results[index];
            if (result.status !== 'fulfilled') return [];
            const sentence = shuffle(result.value).find(entry => entry.jp.includes(item.query) && !current.has(`${entry.jp}（${entry.tw}）`));
            return sentence ? [{ title: item.title, formula: item.formula, example: `${sentence.jp}（${sentence.tw}）` }] : [];
          });
          if (online.length < 2) throw new Error('not enough sentences');
          if (requestId !== contentRequestId) return;
          dynamicPhase5Data = online;
        }
        if (requestId !== contentRequestId) return;
        hasLoadedOnlineContent[phase] = true;
        contentUpdateStatus[phase] = '網路例句來源：Tatoeba';
      } catch (_) {
        if (requestId === contentRequestId) contentUpdateStatus[phase] = '目前無法取得新例句，保留原有內容。';
      } finally {
        if (requestId === contentRequestId && currentPhase === phase) {
          if (spinner) spinner.classList.remove('fa-spin');
          renderContent();
          renderStudyStatus();
        }
      }
    }

    async function updateLearningHint(phase) {
      const requestId = ++hintRequestIds[phase];
      const data = { 1: phase1Data, 2: phase2Data, 3: phase3Data }[phase];
      const item = data[Math.floor(Math.random() * data.length)];
      const spinner = document.getElementById('refreshSpinner');
      if (currentPhase === phase && spinner) spinner.classList.add('fa-spin');
      onlineHints[phase] = { jp: item.word, tw: item.meaning, status: '正在取得網路例句…' };
      renderLearningHint(phase);
      try {
        const url = `https://tatoeba.org/en/api_v0/search?from=jpn&to=cmn&query=${encodeURIComponent(item.word)}&page=1`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('network');
        const payload = await response.json();
        const sentence = payload.results?.find(result => result.text && result.translations?.[0]?.[0]?.text);
        if (!sentence) throw new Error('no result');
        if (requestId === hintRequestIds[phase]) {
          onlineHints[phase] = { jp: sentence.text, tw: sentence.translations[0][0].text, status: '網路例句 · Tatoeba' };
        }
      } catch (_) {
        if (requestId === hintRequestIds[phase]) onlineHints[phase] = { jp: item.word, tw: item.meaning, status: '目前無法取得網路例句，顯示內建提示' };
      } finally {
        if (requestId === hintRequestIds[phase]) {
          if (spinner && currentPhase === phase) spinner.classList.remove('fa-spin');
          renderLearningHint(phase);
        }
      }
    }

    function renderLearningHint(phase) {
      if (currentPhase !== phase) return;
      const hint = onlineHints[phase];
      const panel = document.getElementById('learningHint');
      if (!panel || !hint) return;
      panel.querySelector('[data-hint-status]').textContent = hint.status;
      panel.querySelector('[data-hint-jp]').textContent = hint.jp;
      panel.querySelector('[data-hint-tw]').textContent = hint.tw;
      panel.querySelector('[data-hint-speak]').onclick = () => speak(hint.jp);
    }

    function selectExample(phase, index, playSound = true) {
      selectedExamples[phase] = index;
      const item = { 1: phase1Data, 2: phase2Data, 3: phase3Data }[phase][index];
      const panel = document.getElementById('selectedExample');
      panel.classList.remove('hidden');
      panel.querySelector('[data-example-word]').textContent = item.word;
      panel.querySelector('[data-example-reading]').textContent = item.reading;
      panel.querySelector('[data-example-meaning]').textContent = item.meaning;
      panel.querySelector('[data-example-speak]').onclick = () => speak(item.word);
      placeExampleAfterRow(index);
      document.querySelectorAll('[data-kana-index]').forEach(button => {
        const selected = Number(button.dataset.kanaIndex) === index;
        button.classList.toggle('ring-2', selected);
        button.classList.toggle('ring-indigo-500', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      if (playSound) speak(item.kana);
    }

    function placeExampleAfterRow(index) {
      const grid = document.getElementById('kanaGrid');
      const panel = document.getElementById('selectedExample');
      if (!grid || !panel) return;
      const cards = grid.querySelectorAll('[data-kana-index]');
      const columns = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      const rowEnd = Math.min(cards.length - 1, Math.floor(index / columns) * columns + columns - 1);
      cards[rowEnd].after(panel);
    }

    function renderContent() {
      const area = document.getElementById('contentArea');

      if (currentPhase <= 3) {
        const dataMap = { 1: phase1Data, 2: phase2Data, 3: phase3Data };
        const data = dataMap[currentPhase];
        
        area.innerHTML = `
          <div class="space-y-3">
            <p id="studyStatus" class="text-xs font-bold text-indigo-700 bg-indigo-50 rounded-xl px-3 py-2" aria-live="polite"></p>
            <button id="phaseTestButton" onclick="openTestModal(${currentPhase})" class="w-full py-3 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-pen-to-square"></i>
              <span>開始階段 ${currentPhase} 模擬測驗 (20 題)</span>
            </button>
            <p class="text-xs text-slate-500 px-1">點選假名可聽發音並查看個別範例</p>
            <div id="kanaGrid" class="grid grid-cols-5 sm:grid-cols-7 lg:grid-cols-9 gap-1 sm:gap-1.5">
              ${data.map((item, index) => `
                <button type="button" data-kana-index="${index}" aria-pressed="false" aria-label="${escapeHtml(item.kana)}，${escapeHtml(item.romaji)}，查看範例" class="px-1 py-1.5 bg-white border border-slate-200 rounded-xl active:scale-95 transition flex flex-col items-center justify-center shadow-xs min-h-12">
                  <span class="text-lg sm:text-xl font-bold text-indigo-600">${escapeHtml(item.kana)}</span>
                  <span class="text-[10px] font-mono text-slate-400">${escapeHtml(item.romaji)}</span>
                </button>
              `).join('')}
              <div id="selectedExample" class="hidden bg-white border border-indigo-200 rounded-2xl p-4 shadow-sm space-y-2" style="grid-column: 1 / -1" aria-live="polite">
                <div class="flex items-center justify-between">
                  <p class="text-[11px] font-bold text-indigo-600">個別範例</p>
                  <button type="button" data-example-speak aria-label="播放範例發音" class="text-indigo-600 p-2"><i class="fa-solid fa-volume-high"></i></button>
                </div>
                <p data-example-word class="text-lg font-bold text-slate-800"></p>
                <p data-example-reading class="text-xs text-slate-500"></p>
                <p data-example-meaning class="text-xs text-slate-700"></p>
              </div>
            </div>
            <div id="learningHint" class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 space-y-2" aria-live="polite">
              <div class="flex items-center justify-between">
                <p class="text-[11px] font-bold text-indigo-700">30 分鐘更新提示</p>
                <button type="button" data-hint-speak aria-label="播放提示發音" class="text-indigo-600 p-2"><i class="fa-solid fa-volume-high"></i></button>
              </div>
              <p data-hint-jp class="text-sm font-bold text-slate-800"></p>
              <p data-hint-tw class="text-xs text-slate-600"></p>
              <p data-hint-status class="text-[10px] text-slate-500"></p>
            </div>
          </div>
        `;
        area.querySelectorAll('[data-kana-index]').forEach(button => {
          button.addEventListener('click', () => selectExample(currentPhase, Number(button.dataset.kanaIndex)));
        });
        if (selectedExamples[currentPhase] !== null) selectExample(currentPhase, selectedExamples[currentPhase], false);
        renderLearningHint(currentPhase);
      } else if (currentPhase === 4) {
        area.innerHTML = `
          <div class="space-y-3">
            <p id="studyStatus" class="text-xs font-bold text-indigo-700 bg-indigo-50 rounded-xl px-3 py-2" aria-live="polite"></p>
            <button id="phaseTestButton" onclick="openTestModal(4)" class="w-full py-3 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-pen-to-square"></i>
              <span>開始階段 4 會話測驗 (20 題)</span>
            </button>
            <p class="text-[11px] text-slate-500 px-1" aria-live="polite">${escapeHtml(contentUpdateStatus[4])}</p>
            <div class="space-y-2">
              ${dynamicPhase4Data.map((item, index) => `
                <div class="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-xs space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-bold rounded-md">${escapeHtml(item.scenario || '會話')}</span>
                    <button data-speak-index="${index}" aria-label="播放日語例句" class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs active:scale-90 transition">
                      <i class="fa-solid fa-volume-high"></i>
                    </button>
                  </div>
                  <p class="text-sm font-bold text-slate-800 leading-snug">${escapeHtml(item.jp)}</p>
                  <p class="text-xs text-slate-500">${escapeHtml(item.tw)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        area.querySelectorAll('[data-speak-index]').forEach(button => {
          button.addEventListener('click', () => speak(dynamicPhase4Data[Number(button.dataset.speakIndex)].jp));
        });
      } else if (currentPhase === 5) {
        area.innerHTML = `
          <div class="space-y-3">
            <p id="studyStatus" class="text-xs font-bold text-indigo-700 bg-indigo-50 rounded-xl px-3 py-2" aria-live="polite"></p>
            <button id="phaseTestButton" onclick="openTestModal(5)" class="w-full py-3 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-pen-to-square"></i>
              <span>開始階段 5 語法測驗 (20 題)</span>
            </button>
            <p class="text-[11px] text-slate-500 px-1" aria-live="polite">${escapeHtml(contentUpdateStatus[5])}</p>
            <div class="space-y-2">
              ${dynamicPhase5Data.map((item, index) => `
                <div class="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-xs space-y-2">
                  <h3 class="text-xs font-bold text-indigo-600">${escapeHtml(item.title)}</h3>
                  <div class="p-2 bg-slate-50 border rounded-xl text-[11px] font-mono text-slate-600">${escapeHtml(item.formula)}</div>
                  <div class="flex items-center justify-between pt-1">
                    <p class="text-xs text-slate-700 font-medium">${escapeHtml(item.example)}</p>
                    <button data-grammar-speak-index="${index}" aria-label="播放日語例句" class="text-indigo-600 text-xs ml-2">
                      <i class="fa-solid fa-volume-high"></i>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        area.querySelectorAll('[data-grammar-speak-index]').forEach(button => {
          button.addEventListener('click', () => speak(dynamicPhase5Data[Number(button.dataset.grammarSpeakIndex)].example.split(/[（(]/)[0]));
        });
      } else if (currentPhase === 99) {
        const wrongList = getStoredWrongQuestions();
        if (wrongList.length === 0) {
          area.innerHTML = `
            <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6 space-y-2 shadow-xs">
              <i class="fa-solid fa-circle-check text-4xl text-emerald-500"></i>
              <h3 class="text-sm font-bold text-slate-800">目前沒有錯題！</h3>
              <p class="text-xs text-slate-400">進行階段測驗時答錯的題目會自動記錄於此。</p>
            </div>
          `;
        } else {
          area.innerHTML = `
            <div class="space-y-3">
              <div class="flex items-center justify-between px-1">
                <span class="text-xs text-slate-500 font-medium">共累積 ${wrongList.length} 題錯題</span>
                <button onclick="clearWrongQuestions()" class="text-xs text-red-600 font-bold hover:underline">全部清空</button>
              </div>
              <div class="space-y-2">
                ${wrongList.map((item, index) => `
                  <div class="p-3 bg-red-50/60 border border-red-100 rounded-2xl flex items-center justify-between gap-2 shadow-xs">
                    <div class="space-y-0.5 flex-1 min-w-0">
                      <span class="text-[10px] text-red-500 font-bold block truncate">${escapeHtml(item.question)}</span>
                      <p class="text-xs font-bold text-slate-800 truncate">正確答案：${escapeHtml(item.correctAnswer)}</p>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      <button data-wrong-speak-index="${index}" aria-label="播放錯題" class="w-7 h-7 rounded-full bg-red-500 text-white flex items-center justify-center text-xs active:scale-90 transition">
                        <i class="fa-solid fa-volume-high"></i>
                      </button>
                      <button onclick="removeSingleWrongQuestion(${index})" class="w-7 h-7 rounded-full bg-white text-slate-400 border border-slate-200 hover:text-red-500 flex items-center justify-center text-xs active:scale-90 transition" title="移除此題">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
          area.querySelectorAll('[data-wrong-speak-index]').forEach(button => {
            button.addEventListener('click', () => speak(wrongList[Number(button.dataset.wrongSpeakIndex)].question));
          });
        }
      }
    }

    function openTestModal(phase) {
      if (!phaseUnlocked(phase) || (!developerMode && studySeconds(phase) < PHASE_STUDY_HOURS[phase] * 3600)) return;
      activeTestPhase = phase;
      const modal = document.getElementById('testModal');
      const title = document.getElementById('modalTitle');
      title.innerText = `階段 ${phase} 模擬測驗 (20 題)`;
      
      testQuestions = generate20Questions(phase);
      currentQuestionIdx = 0;
      userScore = 0;
      answerLocked = false;

      renderTestQuestion();
      modal.classList.remove('hidden');
    }

    function generate20Questions(phase) {
      let sourcePool = [];
      if (phase === 1) sourcePool = phase1Data;
      else if (phase === 2) sourcePool = phase2Data;
      else if (phase === 3) sourcePool = phase3Data;
      else if (phase === 4) sourcePool = dynamicPhase4Data;
      else if (phase === 5) sourcePool = dynamicPhase5Data;

      let questions = [];
      const targets = shuffle(sourcePool);
      for (let i = 0; i < 20; i++) {
        const target = targets[i % targets.length];
        let qText = '', correctAns = '', options = [];

        if (phase <= 3) {
          qText = `「${target.kana}」的拼音是？`;
          correctAns = target.romaji;
          let wrongPool = sourcePool.filter(x => x.romaji !== correctAns).map(x => x.romaji);
          wrongPool = shuffle([...new Set(wrongPool)]).slice(0, 3);
          options = shuffle([correctAns, ...wrongPool]);
        } else if (phase === 4) {
          qText = `「${target.jp}」的中文意思是？`;
          correctAns = target.tw;
          let wrongPool = [...new Set([...sourcePool, ...backupPhase4].filter(x => x.tw !== correctAns).map(x => x.tw))];
          options = shuffle([correctAns, ...shuffle(wrongPool).slice(0, 3)]);
        } else {
          qText = `「${target.title}」對應的例句？`;
          correctAns = target.example;
          let wrongPool = [...new Set([...sourcePool, ...backupPhase5].filter(x => x.example !== correctAns).map(x => x.example))];
          options = shuffle([correctAns, ...shuffle(wrongPool).slice(0, 3)]);
        }

        questions.push({ qText, correctAns, options });
      }
      return questions;
    }

    function renderTestQuestion() {
      const body = document.getElementById('modalBody');
      const q = testQuestions[currentQuestionIdx];

      body.innerHTML = `
        <div class="space-y-4">
          <!-- 進度條 -->
          <div class="space-y-1">
            <div class="flex justify-between text-[11px] font-bold text-slate-400">
              <span>進度：${currentQuestionIdx + 1} / 20</span>
              <span>得分：${userScore}</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${((currentQuestionIdx + 1) / 20) * 100}%"></div>
            </div>
          </div>

          <!-- 題目卡片 -->
          <div class="py-2">
            <h4 class="text-base font-bold text-slate-800 leading-snug">${escapeHtml(q.qText)}</h4>
          </div>

          <!-- 選項按鈕 -->
          <div class="space-y-2 pt-1">
            ${q.options.map((opt, index) => `
              <button data-answer-index="${index}" class="w-full p-3.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-2xl text-xs font-bold text-slate-700 text-left transition active:scale-98 flex items-center justify-between">
                <span>${escapeHtml(opt)}</span>
                <i class="fa-regular fa-circle text-slate-300"></i>
              </button>
            `).join('')}
          </div>
          <p id="answerFeedback" class="text-xs font-bold min-h-5" aria-live="polite"></p>
          <button id="nextQuestionButton" class="hidden w-full p-3 bg-indigo-600 text-white rounded-xl text-xs font-bold">下一題</button>
        </div>
      `;
      body.querySelectorAll('[data-answer-index]').forEach(button => {
        button.addEventListener('click', () => handleAnswer(q.options[Number(button.dataset.answerIndex)]));
      });
      body.querySelector('#nextQuestionButton').addEventListener('click', nextQuestion);
    }

    function handleAnswer(selectedOpt) {
      if (answerLocked) return;
      answerLocked = true;
      const q = testQuestions[currentQuestionIdx];
      if (selectedOpt === q.correctAns) {
        userScore += 5;
      } else {
        saveWrongQuestion({
          question: q.qText,
          correctAnswer: q.correctAns
        });
      }

      const buttons = document.querySelectorAll('#modalBody [data-answer-index]');
      buttons.forEach(button => {
        button.disabled = true;
        const value = q.options[Number(button.dataset.answerIndex)];
        if (value === q.correctAns) button.classList.add('border-emerald-500', 'bg-emerald-50');
        else if (value === selectedOpt) button.classList.add('border-red-500', 'bg-red-50');
      });
      const feedback = document.getElementById('answerFeedback');
      feedback.textContent = selectedOpt === q.correctAns ? '答對了！' : `答錯了，正確答案：${q.correctAns}`;
      feedback.classList.add(selectedOpt === q.correctAns ? 'text-emerald-700' : 'text-red-700');
      const next = document.getElementById('nextQuestionButton');
      next.textContent = currentQuestionIdx === 19 ? '查看成績' : '下一題';
      next.classList.remove('hidden');
    }

    function nextQuestion() {
      if (!answerLocked) return;
      answerLocked = false;
      currentQuestionIdx++;
      if (currentQuestionIdx < 20) {
        renderTestQuestion();
      } else {
        renderFinalResult();
      }
    }

    function renderFinalResult() {
      const body = document.getElementById('modalBody');
      const isPassed = userScore >= 85;
      if (isPassed && activeTestPhase) {
        progress.passed[activeTestPhase] = true;
        saveProgress();
        renderTabs();
      }

      body.innerHTML = `
        <div class="text-center py-6 space-y-4">
          <div class="w-16 h-16 ${isPassed ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'} rounded-full flex items-center justify-center text-3xl mx-auto shadow-md">
            <i class="fa-solid ${isPassed ? 'fa-trophy' : 'fa-circle-xmark'}"></i>
          </div>
          <div class="space-y-1">
            <h3 class="text-xl font-bold text-slate-800">總得分：${userScore} 分</h3>
            <p class="text-xs text-slate-500">${isPassed ? '🎉 恭喜通過測驗！' : '💪 答錯的題目已存入「錯題本」。'}</p>
          </div>
          <div class="pt-2 space-y-2">
            <button onclick="closeModal()" class="w-full py-3 bg-slate-800 text-white rounded-2xl text-xs font-bold transition">
              返回練習區
            </button>
            <button onclick="switchPhase(99); closeModal();" class="w-full py-3 bg-red-600 text-white rounded-2xl text-xs font-bold transition">
              查看錯題本
            </button>
          </div>
        </div>
      `;
    }

    function getStoredWrongQuestions() {
      try {
        const list = JSON.parse(localStorage.getItem('jp_app_wrong_questions') || '[]');
        return Array.isArray(list) ? list : [];
      } catch (_) { return []; }
    }

    function saveWrongQuestion(item) {
      let list = getStoredWrongQuestions();
      if (!list.some(x => x.question === item.question)) {
        list.push(item);
        try { localStorage.setItem('jp_app_wrong_questions', JSON.stringify(list)); } catch (_) { /* Keep the test usable. */ }
      }
    }

    function removeSingleWrongQuestion(index) {
      let list = getStoredWrongQuestions();
      list.splice(index, 1);
      localStorage.setItem('jp_app_wrong_questions', JSON.stringify(list));
      if (currentPhase === 99) renderContent();
    }

    function clearWrongQuestions() {
      localStorage.removeItem('jp_app_wrong_questions');
      if (currentPhase === 99) renderContent();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function closeModal() {
      document.getElementById('testModal').classList.add('hidden');
      activeTestPhase = null;
      renderStudyStatus();
    }

  </script>
</body>
</html>
